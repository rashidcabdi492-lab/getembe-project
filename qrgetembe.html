<!-- Table QR Code Generator Section -->
<div class="qr-card">
    <h3 class="qr-title">Generate Table QR Code</h3>
    
    <div class="qr-form">
        <input type="number" id="table-input" placeholder="Enter Table Number (e.g. 1)" class="qr-input">
        <button onclick="generateQR()" class="qr-btn-generate">Generate</button>
    </div>
    
    <div id="qr-result" class="qr-result-container"></div>
</div>

<style>
    .qr-card {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        margin-top: 24px;
        max-width: 450px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .qr-title {
        margin-bottom: 12px;
        color: #1e293b;
        font-size: 18px;
        font-weight: bold;
    }

    .qr-form {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }

    .qr-input {
        padding: 10px;
        flex: 1;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
    }

    .qr-input:focus {
        border-color: #2563eb;
    }

    .qr-btn-generate {
        padding: 10px 18px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .qr-btn-generate:hover {
        background: #1d4ed8;
    }

    .qr-result-container {
        text-align: center;
    }

    .printable-box {
        padding: 24px;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        display: inline-block;
        background: white;
        margin-bottom: 15px;
    }

    .printable-box h2 {
        font-size: 26px;
        margin-bottom: 8px;
        color: #1e293b;
        font-weight: 800;
    }

    .printable-box img {
        display: block;
        margin: 0 auto;
        width: 220px;
        height: 220px;
    }

    .printable-box p {
        font-size: 14px;
        color: #64748b;
        font-weight: 600;
        margin-top: 4px;
    }

    .qr-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .qr-btn-print {
        padding: 10px 16px;
        background: #059669;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.2s;
    }

    .qr-btn-print:hover {
        background: #047857;
    }

    .qr-btn-download {
        padding: 10px 16px;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        display: inline-block;
        transition: background 0.2s;
    }

    .qr-btn-download:hover {
        background: #4338ca;
    }

    /* Print-Specific Styling Rule (Hides everything else when printing) */
    @media print {
        body * {
            visibility: hidden;
        }
        #printable-qr, #printable-qr * {
            visibility: visible;
        }
        #printable-qr {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            border: none !important;
        }
    }
</style>

<script>
    function generateQR() {
        const tableNum = document.getElementById("table-input").value;
        const qrResult = document.getElementById("qr-result");
        
        if (!tableNum) {
            alert("Please enter a table number!");
            return;
        }

        // Dynamically points to customer.html with the table number AND a scanned flag
        const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/customer.html');
        const fullUrl = `${baseUrl}?table=${tableNum}&scanned=true`;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(fullUrl)}`;

        qrResult.innerHTML = `
            <div id="printable-qr" class="printable-box">
                <h2>Table ${tableNum}</h2>
                <img src="${qrApiUrl}" alt="Table ${tableNum} QR Code"><br>
                <p>Scan to view menu & order</p>
            </div>
            
            <div class="qr-actions">
                <button onclick="window.print()" class="qr-btn-print">🖨️ Print QR Code</button>
                <a href="${qrApiUrl}" download="Table_${tableNum}_QR.png" class="qr-btn-download">⬇️ Download</a>
            </div>
        `;
    }
</script>
